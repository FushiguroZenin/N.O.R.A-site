name: NORA verify

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Compile the source
        run: python -m compileall -q .

      - name: Report result to N.O.R.A
        if: always()
        env:
          NORA_VERIFY_ENDPOINT: ${{ secrets.NORA_VERIFY_ENDPOINT }}
          NORA_VERIFY_WEBHOOK_SECRET: ${{ secrets.NORA_VERIFY_WEBHOOK_SECRET }}
          NORA_CONCLUSION: ${{ job.status }}
          NORA_REPOSITORY: ${{ github.repository }}
          NORA_COMMIT: ${{ github.sha }}
        run: |
          curl --fail-with-body --request POST "$NORA_VERIFY_ENDPOINT" \
            --header "Content-Type: application/json" \
            --header "x-nora-verify-secret: $NORA_VERIFY_WEBHOOK_SECRET" \
            --data "{\"repository\":\"$NORA_REPOSITORY\",\"commit\":\"$NORA_COMMIT\",\"conclusion\":\"$NORA_CONCLUSION\",\"runtime\":\"Python 3.12 · pip\",\"summary\":\"Declared dependencies installed and Python source compiled.\"}"
